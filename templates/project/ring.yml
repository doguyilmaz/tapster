- name: Ring the tapster hub
  if: ${{ vars.TAPSTER_DOORBELL != '' }}
  continue-on-error: true
  env: { DOORBELL: "${{ vars.TAPSTER_DOORBELL }}" }
  run: |
    set -euo pipefail
    token=$(curl -fsS -G --data-urlencode "audience=$DOORBELL" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
    echo "::add-mask::$token"
    curl -fsS -X POST -H "Authorization: Bearer $token" "$DOORBELL"
