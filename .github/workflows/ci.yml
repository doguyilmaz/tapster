name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test
      - name: dist/ matches the source
        run: bun run build:action && git diff --exit-code dist/
  protection:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Only the owner can move main and the release tags
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          bun -e 'import { GitHub } from "./src/github"; import { protectionProblems } from "./src/rulesets";
          const p = await protectionProblems(new GitHub(process.env.GH_TOKEN!), process.env.REPO!, "main", "app");
          if (p.length) { console.error(p.join("\n")); process.exit(1); }'
  macos:
    runs-on: macos-15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
  linux:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils rpm createrepo-c dpkg gnupg
      - name: A throwaway signing key
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "tapster e2e" rsa4096 sign never
          gpg --batch --armor --export-secret-keys > "$RUNNER_TEMP/key.asc"
          gpgconf --kill all
      - name: Build, check and sign a fixture repository twice and refuse planted packages
        run: bun tests/linux/e2e.ts "$RUNNER_TEMP" "$RUNNER_TEMP/key.asc"
      - name: Install from it with apt and dnf
        run: bash tests/linux/install.sh "$RUNNER_TEMP/site1"
