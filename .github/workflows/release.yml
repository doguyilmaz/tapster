name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test
      - name: dist/ matches the source
        run: bun run build:action && git diff --exit-code dist/
      - name: Build the CLI for every target
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          v="${TAG#v}"
          printf 'export const TAPSTER: { version: string; sha: string | null } = { version: "%s", sha: "%s" };\n' "$v" "$GITHUB_SHA" > src/version.ts
          mkdir -p out
          for t in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun scripts/build.ts compile "bun-$t" "out/$t/tapster"
            p="${t/x64/amd64}"
            tar -C "out/$t" -czf "out/tapster_${v}_${p/-/_}.tar.gz" tapster
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: builds, path: "out/*.tar.gz", if-no-files-found: error, retention-days: 1 }
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: builds, path: out }
      - name: List the files
        run: cd out && sha256sum *.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with: { subject-checksums: out/checksums.txt }
      - name: Hand the draft to the tapster hub
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: gh release create "$TAG" out/*.tar.gz out/checksums.txt --draft --verify-tag --generate-notes --title "$TAG" $( [ "${TAG#*-}" != "$TAG" ] && echo --prerelease )
      - name: Ring the tapster hub
        if: ${{ vars.TAPSTER_DOORBELL != '' }}
        continue-on-error: true
        env: { DOORBELL: "${{ vars.TAPSTER_DOORBELL }}" }
        run: |
          set -euo pipefail
          token=$(curl -fsS -G --data-urlencode "audience=$DOORBELL" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          curl -fsS -X POST -H "Authorization: Bearer $token" "$DOORBELL"
