name: leak
on:
  push: { branches: [main] }
  pull_request:
permissions: {}
concurrency: { group: "leak-${{ github.ref }}", cancel-in-progress: true }
env:
  PLAIN_CANARIES: |
    CANARY-app-key-3f9a7c1e5b2d
    CANARY-p12-body-2e8c
    CANARY-p12-password-7f3a9c2e1b
    CANARY-notary-key-b81e44d0c9
    CANARY-key-id-55aa
    CANARY-issuer-0c4a72
    CANARY-github-token-91df3e
    ghs_CANARYq7Zx81mPkW3vT9yLr2dNf5bHj4
    CANARYsparkleSeedq7Zx81mPkW3vT9yLr2dNf5bHjA=
    080340458b296ab92579279e76aed9c7cd663e45b7bd3f722ebd9d35fe5b1e30
    gNrmRAB3S3v/YKC3kQBV3LKDd6/di8CmV9d1bP7Ctn6a0usQ+7Jj8Dv35MEq4oCp+5gJrjW4DZGGWS4hlNnxd9pltEpJmwgJPZw7Fs9qHw31fWymDU6QwHoUyhwCmqaa
    80dae64400774b7bff60a0b7910055dcb28377afdd8bc0a657d7756cfec2b67e9ad2eb10fbb263f03bf7e4c12ae280a9fb9809ae35b80d9186592e2194d9f177da65b44a499b08093d9c3b16cf6a1f0df57d6ca60d4e90c07a14ca1c029aa69a
    gNrmRAB3S3v/YKC3kQBV3LKDd6/di8CmV9d1bP7Ctn6a0usQ+7Jj8Dv35MEq4oCp+5gJrjW4DZGGWS4hlNnxdw==
    CANARY-sparkle-malformed-6d2f9a
    CANARY-linux-malformed-4b7e1d
jobs:
  plain:
    runs-on: macos-15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: one fake work item for sign
        run: |
          mkdir -p "$RUNNER_TEMP/tapster/fixture/v0.0.1/bin/a"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/m.c" && clang -o "$RUNNER_TEMP/tapster/fixture/v0.0.1/bin/a/fixture" "$RUNNER_TEMP/m.c"
          printf '%s' '{"items":[{"package":"fixture","tag":"v0.0.1","releaseId":1,"resume":false,"before":[],"checksums":[],"archives":[{"asset":"a","platform":"darwin-arm64","dir":"'"$RUNNER_TEMP"'/tapster/fixture/v0.0.1/bin/a","binaries":["fixture"]}],"status":"fetched"}]}' > "$RUNNER_TEMP/tapster/manifest.json"
      - name: check (fake App key)
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/tapster.yml }
        env: { TAPSTER_APP_ID: "1", TAPSTER_APP_PRIVATE_KEY: "CANARY-app-key-3f9a7c1e5b2d" }
      - name: sign (fake certificate and key)
        continue-on-error: true
        uses: ./
        with: { mode: sign, config: tests/leak/hub/tapster.yml }
        env:
          TAPSTER_TEAM_ID: CANARY0001
          MACOS_SIGN_P12: Q0FOQVJZLXAxMi1ib2R5LTJlOGM=
          MACOS_SIGN_PASSWORD: CANARY-p12-password-7f3a9c2e1b
          MACOS_NOTARY_KEY: CANARY-notary-key-b81e44d0c9
          MACOS_NOTARY_KEY_ID: CANARY-key-id-55aa
          MACOS_NOTARY_ISSUER_ID: CANARY-issuer-0c4a72
      - name: render (fake token)
        continue-on-error: true
        uses: ./
        with: { mode: render, config: tests/leak/hub/tapster.yml }
        env: { GITHUB_TOKEN: CANARY-github-token-91df3e }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - name: three sealed app items for sparkle
        run: bun tests/leak/sparkle.ts "$RUNNER_TEMP"
      - name: sparkle (two canary keys, one app pinned to the other key)
        continue-on-error: true
        uses: ./
        with: { mode: sparkle, config: tests/leak/hub/sparkle.yml }
        env: { SPARKLE_KEY_LEAKSEED: "CANARYsparkleSeedq7Zx81mPkW3vT9yLr2dNf5bHjA=", SPARKLE_KEY_LEAKOLD: "gNrmRAB3S3v/YKC3kQBV3LKDd6/di8CmV9d1bP7Ctn6a0usQ+7Jj8Dv35MEq4oCp+5gJrjW4DZGGWS4hlNnxd9pltEpJmwgJPZw7Fs9qHw31fWymDU6QwHoUyhwCmqaa" }
      - name: the same items again
        run: bun tests/leak/sparkle.ts "$RUNNER_TEMP"
      - name: sparkle (malformed key)
        continue-on-error: true
        uses: ./
        with: { mode: sparkle, config: tests/leak/hub/sparkle.yml }
        env: { SPARKLE_KEY_LEAKSEED: CANARY-sparkle-malformed-6d2f9a, SPARKLE_KEY_LEAKOLD: "gNrmRAB3S3v/YKC3kQBV3LKDd6/di8CmV9d1bP7Ctn6a0usQ+7Jj8Dv35MEq4oCp+5gJrjW4DZGGWS4hlNnxd9pltEpJmwgJPZw7Fs9qHw31fWymDU6QwHoUyhwCmqaa" }
      - if: always()
        uses: ./
        with: { mode: cleanup }
  plain-api:
    runs-on: macos-15
    permissions: { contents: read }
    outputs:
      canaries: ${{ steps.key.outputs.canaries }}
    env: { GITHUB_TOKEN: CANARY-github-token-91df3e, TAPSTER_APP_ID: "12345" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - name: stand in for api.github.com and uploads.github.com
        run: |
          d="$RUNNER_TEMP/stub" && mkdir -p "$d"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/key.pem" -out "$d/cert.pem" -days 1 -subj "/CN=tapster leak stub" \
            -addext "subjectAltName=DNS:api.github.com,DNS:uploads.github.com" 2>/dev/null
          echo "127.0.0.1 api.github.com uploads.github.com" | sudo tee -a /etc/hosts >/dev/null
          sudo nohup "$(command -v bun)" tests/leak/stub.ts "$d/cert.pem" "$d/key.pem" 443 > "$d/stub.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf --cacert "$d/cert.pem" https://api.github.com/__mode/ok >/dev/null && break; sleep 0.5; done
          echo "NODE_EXTRA_CA_CERTS=$d/cert.pem" >> "$GITHUB_ENV"
          echo "STUB_CA=$d/cert.pem" >> "$GITHUB_ENV"
      - id: key
        name: a fresh RSA key as the App key canary
        run: |
          k=$(/usr/bin/openssl genrsa 2048 2>/dev/null)
          { echo "TAPSTER_APP_PRIVATE_KEY<<PEM"; printf '%s\n' "$k"; echo "PEM"; } >> "$GITHUB_ENV"
          echo "canaries=$(printf '%s\n' "$k" | grep -v '^-----' | base64 | tr -d '\n' | rev)" >> "$GITHUB_OUTPUT"
      - id: check
        name: check through the stub
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/stub.yml }
      - name: fetch through the stub
        continue-on-error: true
        uses: ./
        with: { mode: fetch, config: tests/leak/hub/stub.yml, work: "${{ steps.check.outputs.work }}" }
      - name: sign (nothing to sign)
        continue-on-error: true
        uses: ./
        with: { mode: sign, config: tests/leak/hub/stub.yml }
      - name: publish through the stub
        continue-on-error: true
        uses: ./
        with: { mode: publish, config: tests/leak/hub/stub.yml }
      - name: publish again (already published)
        continue-on-error: true
        uses: ./
        with: { mode: publish, config: tests/leak/hub/stub.yml }
      - name: bring the state publish wrote into the hub checkout
        run: |
          mkdir -p .tapster
          curl -sf --cacert "$STUB_CA" https://api.github.com/repos/doguyilmaz/tapster/contents/.tapster/state.json | python3 -c 'import sys, json, base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode())' > .tapster/state.json
          git config user.name leak && git config user.email leak@localhost && git add .tapster && git commit -qm state
      - name: render through the stub
        continue-on-error: true
        uses: ./
        with: { mode: render, config: tests/leak/hub/stub.yml }
      - run: curl -sf --cacert "$STUB_CA" https://api.github.com/__mode/500 >/dev/null
      - name: check during an outage
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/stub.yml }
      - run: curl -sf --cacert "$STUB_CA" https://api.github.com/__mode/404 >/dev/null
      - name: check without an installation
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/stub.yml }
      - run: curl -sf --cacert "$STUB_CA" https://api.github.com/__mode/422 >/dev/null
      - name: check with a rejected token request
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/stub.yml }
      - run: curl -sf --cacert "$STUB_CA" https://api.github.com/__mode/drop >/dev/null || true
      - name: check with dropped connections
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/stub.yml }
      - if: always()
        uses: ./
        with: { mode: cleanup }
  masked:
    runs-on: macos-15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: trust the canary certificate so the keychain and codesign paths run
        run: sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain tests/leak/canary-cert.pem
      - name: one fake work item for sign, replaced by fetch when the CI App can read the fixture
        run: |
          mkdir -p "$RUNNER_TEMP/tapster/fixture/v0.0.1/bin/a"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/m.c" && clang -o "$RUNNER_TEMP/tapster/fixture/v0.0.1/bin/a/fixture" "$RUNNER_TEMP/m.c"
          printf '%s' '{"items":[{"package":"fixture","tag":"v0.0.1","releaseId":1,"resume":false,"before":[],"checksums":[],"archives":[{"asset":"a","platform":"darwin-arm64","dir":"'"$RUNNER_TEMP"'/tapster/fixture/v0.0.1/bin/a","binaries":["fixture"]}],"status":"fetched"}]}' > "$RUNNER_TEMP/tapster/manifest.json"
      - id: check
        continue-on-error: true
        uses: ./
        with: { mode: check, config: tests/leak/hub/tapster.yml }
        env: { TAPSTER_APP_ID: "${{ vars.CI_APP_ID }}", TAPSTER_APP_PRIVATE_KEY: "${{ secrets.CI_APP_PRIVATE_KEY }}" }
      - name: fetch the fixture drafts (one good, one malformed, one malicious)
        continue-on-error: true
        uses: ./
        with: { mode: fetch, config: tests/leak/hub/tapster.yml, work: "${{ steps.check.outputs.work }}" }
        env: { TAPSTER_APP_ID: "${{ vars.CI_APP_ID }}", TAPSTER_APP_PRIVATE_KEY: "${{ secrets.CI_APP_PRIVATE_KEY }}" }
      - name: sign (canary certificate, fails on purpose at the team check)
        continue-on-error: true
        uses: ./
        with: { mode: sign, config: tests/leak/hub/tapster.yml }
        env:
          TAPSTER_TEAM_ID: CANARY0001
          MACOS_SIGN_P12: ${{ secrets.CI_CANARY_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.CI_CANARY_P12_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.CI_CANARY_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.CI_CANARY_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.CI_CANARY_NOTARY_ISSUER_ID }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - name: three sealed app items for sparkle
        run: bun tests/leak/sparkle.ts "$RUNNER_TEMP"
      - name: sparkle (two canary keys, one app pinned to the other key)
        continue-on-error: true
        uses: ./
        with: { mode: sparkle, config: tests/leak/hub/sparkle.yml }
        env: { SPARKLE_KEY_LEAKSEED: "${{ secrets.CI_CANARY_SPARKLE_SEED }}", SPARKLE_KEY_LEAKOLD: "${{ secrets.CI_CANARY_SPARKLE_EXPANDED }}" }
      - name: the same items again
        run: bun tests/leak/sparkle.ts "$RUNNER_TEMP"
      - name: sparkle (malformed key)
        continue-on-error: true
        uses: ./
        with: { mode: sparkle, config: tests/leak/hub/sparkle.yml }
        env: { SPARKLE_KEY_LEAKSEED: "${{ secrets.CI_CANARY_SPARKLE_MALFORMED }}", SPARKLE_KEY_LEAKOLD: "${{ secrets.CI_CANARY_SPARKLE_EXPANDED }}" }
      - if: always()
        uses: ./
        with: { mode: cleanup }
  plain-linux:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      canaries: ${{ steps.key.outputs.canaries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils rpm createrepo-c dpkg gnupg
      - name: an unsigned fixture repository
        run: bun tests/leak/linux.ts "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - id: key
        name: a fresh signing key as the Linux key canary
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "tapster leak" rsa4096 sign never 2>/dev/null
          k=$(gpg --batch --armor --export-secret-keys)
          gpgconf --kill all
          { echo "TAPSTER_LINUX_KEY<<PGP"; printf '%s\n' "$k"; echo "PGP"; } >> "$GITHUB_ENV"
          echo "canaries=$(printf '%s\n' "$k" | grep -v -e '^-----' -e '^$' -e '^=' | base64 | tr -d '\n' | rev)" >> "$GITHUB_OUTPUT"
      - name: stand in for github.com release downloads
        run: |
          d="$RUNNER_TEMP/stub" && mkdir -p "$d"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/key.pem" -out "$d/cert.pem" -days 1 -subj "/CN=tapster leak stub" \
            -addext "subjectAltName=DNS:github.com" 2>/dev/null
          echo "127.0.0.1 github.com" | sudo tee -a /etc/hosts >/dev/null
          sudo nohup "$(command -v bun)" tests/leak/files-stub.ts "$d/cert.pem" "$d/key.pem" "$RUNNER_TEMP/releases" 443 > "$d/stub.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf --cacert "$d/cert.pem" -o /dev/null https://github.com/doguyilmaz/tapster-fixture/releases/download/v1.2.3/checksums.txt && break; sleep 0.5; done
          echo "NODE_EXTRA_CA_CERTS=$d/cert.pem" >> "$GITHUB_ENV"
      - run: rm -rf "$RUNNER_TEMP/tapster-linux" && cp -r "$RUNNER_TEMP/linux-unsigned" "$RUNNER_TEMP/tapster-linux"
      - name: linux-sign (canary key)
        continue-on-error: true
        uses: ./
        with: { mode: linux-sign, config: tests/leak/hub/linux.yml }
      - run: rm -rf "$RUNNER_TEMP/tapster-linux" && cp -r "$RUNNER_TEMP/linux-unsigned" "$RUNNER_TEMP/tapster-linux"
      - name: linux-sign (malformed key)
        continue-on-error: true
        uses: ./
        with: { mode: linux-sign, config: tests/leak/hub/linux.yml }
        env: { TAPSTER_LINUX_KEY: "CANARY-linux-malformed-4b7e1d" }
  masked-linux:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends apt-utils rpm createrepo-c dpkg gnupg
      - name: an unsigned fixture repository
        run: bun tests/leak/linux.ts "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
      - name: stand in for github.com release downloads
        run: |
          d="$RUNNER_TEMP/stub" && mkdir -p "$d"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/key.pem" -out "$d/cert.pem" -days 1 -subj "/CN=tapster leak stub" \
            -addext "subjectAltName=DNS:github.com" 2>/dev/null
          echo "127.0.0.1 github.com" | sudo tee -a /etc/hosts >/dev/null
          sudo nohup "$(command -v bun)" tests/leak/files-stub.ts "$d/cert.pem" "$d/key.pem" "$RUNNER_TEMP/releases" 443 > "$d/stub.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf --cacert "$d/cert.pem" -o /dev/null https://github.com/doguyilmaz/tapster-fixture/releases/download/v1.2.3/checksums.txt && break; sleep 0.5; done
          echo "NODE_EXTRA_CA_CERTS=$d/cert.pem" >> "$GITHUB_ENV"
      - run: rm -rf "$RUNNER_TEMP/tapster-linux" && cp -r "$RUNNER_TEMP/linux-unsigned" "$RUNNER_TEMP/tapster-linux"
      - name: linux-sign (canary key)
        continue-on-error: true
        uses: ./
        with: { mode: linux-sign, config: tests/leak/hub/linux.yml }
        env: { TAPSTER_LINUX_KEY: "${{ secrets.CI_CANARY_LINUX_KEY }}" }
      - run: rm -rf "$RUNNER_TEMP/tapster-linux" && cp -r "$RUNNER_TEMP/linux-unsigned" "$RUNNER_TEMP/tapster-linux"
      - name: linux-sign (malformed key)
        continue-on-error: true
        uses: ./
        with: { mode: linux-sign, config: tests/leak/hub/linux.yml }
        env: { TAPSTER_LINUX_KEY: "${{ secrets.CI_CANARY_LINUX_MALFORMED }}" }
  scan:
    needs: [plain, plain-api, masked, plain-linux, masked-linux]
    if: always()
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: 1.4.3 }
      - run: bun tests/leak/run-scan.ts
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA_CANARIES: ${{ needs.plain-api.outputs.canaries }}
          EXTRA_CANARIES_LINUX: ${{ needs.plain-linux.outputs.canaries }}
          EXPECT_STAGES: >-
            {"plain":["tapster: failed (openssl exited with", "leakseed v1.0.0: signed the DMG and appcast.xml", "leakold v1.0.0: signed the DMG and appcast.xml",
            "leakwrong v1.0.0: failed (the Sparkle key leakseed does not belong", "leakseed v1.0.0: failed (SPARKLE_KEY_LEAKSEED: the Sparkle key is not base64"],
            "masked":["fixture v0.0.1: failed (", "leakseed v1.0.0: signed the DMG and appcast.xml", "leakold v1.0.0: signed the DMG and appcast.xml",
            "leakwrong v1.0.0: failed (the Sparkle key leakseed does not belong", "leakseed v1.0.0: failed (SPARKLE_KEY_LEAKSEED: the Sparkle key is not base64"],
            "plain-linux":["linux: signed 1 checked package with key", "tapster: failed (gpg exited with"],
            "masked-linux":["linux: signed 1 checked package with key", "tapster: failed (gpg exited with"],
            "plain-api":["fixture-linux v0.0.9: published", "Casks/fixture-linux.rb: rendered",
            "fixture-linux v0.0.9: failed (the release was published while tapster worked on it",
            "returned 500", "returned 404", "returned 422", "network error"]}
