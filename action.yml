name: Tapster Release Hub
description: Sign, notarize and publish the releases of all your projects from one Homebrew tap
author: Dogu Yilmaz
branding:
  icon: package
  color: orange
inputs:
  mode:
    description: check | fetch | sign | package | seal | sparkle | publish | render | linux-build | linux-sign | cleanup
    required: true
  work:
    description: Work list from the check job (JSON)
    required: false
    default: "[]"
  package:
    description: Limit the check to one package
    required: false
    default: ""
  config:
    description: Path of the hub config
    required: false
    default: tapster.yml
outputs:
  work:
    description: Work list (JSON, check mode)
  render:
    description: "true when the render job has something to do (check mode)"
  attest:
    description: "true when publish wrote files to attest"
  attest-path:
    description: Glob of the files to attest
  linux:
    description: "true when the Linux jobs have something to do (check mode)"
  changed:
    description: "true when the Linux repositories need a new deploy (linux-build mode)"
runs:
  using: node24
  main: dist/index.js
